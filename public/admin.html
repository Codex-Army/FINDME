<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>FIELD//OSINT — Admin Console</title>
<link rel="stylesheet" href="/style.css"></head>
<body><div class="grid-bg" aria-hidden="true"></div>
<header class="topbar"><div class="logo">FIELD<span>//</span>OSINT <span style="color:var(--dim);font-size:12px">ADMIN</span></div>
<div class="topbar-right"><span class="status"><i class="dot"></i>MISSION 001 MONITOR</span><button id="out" class="btn btn-ghost btn-sm" hidden>LOG OUT</button></div></header>
<main style="padding-top:30px">
<section id="login" class="panel login"><h2 class="panel-title">ADMINISTRATOR ACCESS</h2>
<form id="lf"><label for="pw">Administrator password</label><input id="pw" type="text" autocomplete="off" spellcheck="false" style="-webkit-text-security:disc">
<p class="hint-line"></p><button class="btn" type="submit">AUTHENTICATE</button><p class="msg" id="lm" role="alert"></p></form></section>
<section id="dash" hidden>
<div class="adm-stats">
<div class="stat"><span class="k">PARTICIPANTS</span><span class="v" id="sP">0</span></div>
<div class="stat"><span class="k">COMPLETED</span><span class="v" id="sC">0</span></div>
<div class="stat"><span class="k">ONGOING</span><span class="v" id="sO">0</span></div>
<div class="stat"><span class="k">HIGHEST SCORE</span><span class="v" id="sH">0</span></div></div>
<div class="adm-bar">
<input id="search" type="text" placeholder="Search username" aria-label="Search username">
<select id="filter" aria-label="Filter"><option value="all">All students</option><option value="completed">Completed</option><option value="incomplete">Incomplete</option></select>
<select id="sort" aria-label="Sort"><option value="points">Sort: points</option><option value="completion">Sort: completion</option><option value="recent">Sort: last activity</option><option value="name">Sort: username</option></select>
<button class="btn btn-sm" id="refresh">REFRESH</button><a class="btn btn-sm" href="/api/admin/export.csv" style="text-decoration:none">EXPORT CSV</a><span class="hint-line" id="upd" style="margin:0"></span></div>
<div class="tbl-wrap"><table><thead><tr><th>USERNAME</th><th>START</th><th>LAST ACTIVITY</th><th>SOLVED</th><th>POINTS</th><th>COMPLETION</th><th>STATUS</th><th>COMPLETED AT</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></main>
<script src="/admin.js"></script></body></html>
